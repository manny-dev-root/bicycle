<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Control y Velocidad: El Gancho Invisible</title>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
html,body{height:100%;margin:0;background:#07060f;overflow:hidden;font-family:'Chakra Petch',system-ui,sans-serif;color:#eef;touch-action:none;user-select:none}
#c,#c canvas{position:fixed;inset:0;display:block}
.glass{background:rgba(10,8,25,.55);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.14);border-radius:14px}
.item{position:relative;width:46px;text-align:center;padding:2px 0}.item span{font-size:32px;line-height:1.15;display:block}
.item.lost span{animation:shat .6s forwards}.item.lost::after{content:'✖';position:absolute;inset:0;display:grid;place-items:center;color:#f87171;font-size:30px;font-weight:700}
@keyframes shat{30%{transform:scale(1.3) rotate(8deg);filter:brightness(3)}100%{transform:scale(.8) rotate(-12deg);opacity:.25;filter:grayscale(1)}}
#vg{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 35%,#000 105%);opacity:0}
#fl{position:fixed;inset:0;pointer-events:none;background:#fff;opacity:0}
#fl.go{animation:fl .9s ease-out}@keyframes fl{0%{opacity:1}100%{opacity:0}}
.btn{border-radius:12px;font-weight:700;padding:12px 18px;transition:transform .1s}.btn:active{transform:scale(.96)}
.ov{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:16px}
.hidden{display:none!important}
#hud{position:fixed;inset:0;z-index:5;pointer-events:none;padding:max(12px,env(safe-area-inset-top)) 12px max(12px,env(safe-area-inset-bottom))}
#hud button{pointer-events:auto}
#cardrow{display:flex;gap:min(2.5vw,18px);align-items:stretch;justify-content:center;width:96vw;max-width:640px}
.card{--c:#22d3ee;flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;padding:14px 8px 12px;color:#fff;font-family:inherit;border:0;
 background:linear-gradient(170deg,color-mix(in srgb,var(--c) 60%,#0a0818),#0a0818 92%);box-shadow:inset 0 0 0 2px var(--c);
 clip-path:polygon(0 0,calc(100% - 16px) 0,100% 16px,100% 100%,16px 100%,0 calc(100% - 16px));transition:transform .15s}
.card:hover,.card:focus-visible{transform:translateY(-8px)}
.card .ic{font-size:clamp(30px,9vw,54px);line-height:1;text-shadow:0 0 18px var(--c)}
.card b{display:block;font-size:clamp(11px,3.1vw,17px);line-height:1.15;color:#fff}
.card .up,.card .dn{display:block;width:100%;font-size:clamp(9px,2.5vw,13px);line-height:1.25;padding:6px 4px 0}
.card .up{color:#bbf7d0;border-top:1px solid rgba(255,255,255,.3)}.card .dn{color:#fecaca;border-top:1px solid rgba(255,255,255,.3)}
.card i{display:block;font-style:normal;font-weight:700;font-size:.85em;opacity:.75}
@media (prefers-reduced-motion:reduce){#fl.go{animation-duration:.2s}}
</style></head>
<body>
<div id="c"></div><div id="vg"></div><div id="fl"></div>

<div id="hud" class="hidden">
 <div class="flex justify-between items-start gap-2">
  <div id="inv" class="flex flex-col gap-1"></div>
  
  <div class="text-right"><svg id="gauge" viewBox="0 0 120 90" width="132" height="99" style="background:rgba(10,14,12,.45);border-radius:14px"></svg><span id="dist" class="hidden">0</span></div>
 </div>
 <div id="riskTag" class="hidden mt-2 mx-auto w-fit glass px-3 py-1 text-sm text-red-300"></div>
 <div class="absolute left-1/2 -translate-x-1/2 text-5xl font-bold flex items-center gap-3" style="top:max(10px,env(safe-area-inset-top));text-shadow:0 2px 8px rgba(0,0,0,.8)"><span>💎</span><span>x <span id="score">0</span></span></div>
 <div id="ovw" class="hidden mt-2 mx-auto w-fit px-4 py-2 rounded-xl font-bold text-white animate-pulse" style="background:#b91c1c;box-shadow:0 0 24px #ef4444"></div>
 <button id="banner" class="hidden absolute left-1/2 -translate-x-1/2 top-[30%] px-5 py-3 rounded-xl font-bold text-black text-center" style="background:linear-gradient(90deg,#fbbf24,#f0abfc);box-shadow:0 0 30px #f0abfc">¡CASI LO LOGRÁS!<br><span class="text-sm">+50% de velocidad disponible · tocá acá</span></button>
 <div class="absolute left-0 right-0 flex items-end justify-between gap-3 px-3" style="bottom:max(14px,env(safe-area-inset-bottom))">
  <button id="bl" class="glass w-12 h-12 text-2xl opacity-70">◀</button>
  <button id="brake" class="btn text-white text-xl md:text-2xl flex-1 max-w-xs" style="background:#dc2626;padding:14px 10px">FRENAR AHORA</button>
  <button id="br" class="glass w-12 h-12 text-2xl opacity-70">▶</button>
 </div>
</div>

<div id="prompt" class="ov hidden" style="background:rgba(0,0,0,.35)">
 <div class="glass max-w-md w-full p-5 text-center" style="border-color:#ef4444;box-shadow:0 0 40px rgba(239,68,68,.5)">
  <div class="text-2xl font-bold text-red-400">¡GEMAS PERDIDAS!</div>
  <p id="ptxt" class="my-3"></p>
  <div class="h-1.5 bg-white/10 rounded mb-4 overflow-hidden"><div id="pbar" class="h-full bg-red-500" style="width:100%"></div></div>
  <div id="prow" class="flex gap-2 mb-2"></div>
  <button id="no" class="btn w-full glass">NO RECUPERAR</button>
 </div>
</div>

<div id="cards" class="ov hidden" style="z-index:4;flex-direction:column;background:rgba(5,4,12,.6)"><div class="text-2xl font-bold text-center">Elegí una mejora</div><div class="text-sm text-slate-300 mb-4 text-center">Más premios, pero también más riesgo</div><div id="cardrow"></div></div>
<div id="menu" class="ov" style="background:radial-gradient(circle at 50% 30%,rgba(40,120,70,.4),rgba(6,16,10,.92))">
 <div class="glass max-w-lg w-full p-6 text-center">
  <h1 class="text-3xl font-bold leading-tight">Control y Velocidad:<br>El Gancho Invisible</h1>
  <p class="mt-3 text-slate-300">Pedaleá por el camino del bosque. Juntá gemas, esquivá obstáculos y cuidá tus 4 pertenencias. Podés frenar cuando quieras.</p>
  <p class="mt-3 text-sm text-cyan-300">Deslizá o usá ◀ ▶ · Teclado: ← → / A D</p>
  <button id="start" class="btn mt-5 text-black text-xl w-full" style="background:linear-gradient(90deg,#22d3ee,#e879f9)">COMENZAR</button>
 </div>
</div>

<div id="end" class="ov hidden overflow-y-auto items-start" style="background:rgba(5,4,12,.94)"><div id="endin" class="glass max-w-2xl w-full p-5 my-4"></div></div>

<script>
const $=id=>document.getElementById(id);
const L=[-3,0,3];
const IT={phone:{i:'📱',n:'Smartphone',m:2},console:{i:'🎮',n:'Consola',m:1.5},head:{i:'🎧',n:'Auriculares',m:1.2},shoes:{i:'👟',n:'Zapatillas',m:1.1}};
const RO=['head','shoes','console','phone'];
let state='MENU',S={},objs=[],parts=[],last=0,gv=30;
$('inv').innerHTML=Object.keys(IT).map(k=>`<div class="item" id="i_${k}"><span>${IT[k].i}</span></div>`).join('');

/* ---------- Audio ---------- */
const A={};
function aStart(){
 if(!A.c){A.c=new(window.AudioContext||window.webkitAudioContext)();A.m=A.c.createGain();A.m.connect(A.c.destination)}
 A.c.resume();A.m.gain.value=1;

}
function aStop(){try{A.o1.stop();A.o2.stop()}catch(e){}A.o1=null}
function beep(f,d=.12,ty='sine',v=.15,sl=0){
 if(!A.c||A.m.gain.value===0)return;const n=A.c.currentTime,o=A.c.createOscillator(),g=A.c.createGain();
 o.type=ty;o.frequency.setValueAtTime(f,n);if(sl)o.frequency.linearRampToValueAtTime(f+sl,n+d);
 g.gain.setValueAtTime(v,n);g.gain.exponentialRampToValueAtTime(.001,n+d);o.connect(g);g.connect(A.m);o.start(n);o.stop(n+d);
}
const gemSnd=gt=>{const b=[660,880,1200][gt];beep(b,.1,'triangle');setTimeout(()=>beep(b*1.5,.14,'triangle'),70);if(gt==2)setTimeout(()=>beep(b*2,.2,'triangle'),150)};

/* ---------- Escena ---------- */
const R=new THREE.WebGLRenderer({antialias:true});R.setPixelRatio(Math.min(devicePixelRatio,2));R.shadowMap.enabled=true;$('c').appendChild(R.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color(0x9cc7d6);scene.fog=new THREE.Fog(0x9cc7d6,40,140);
const cam=new THREE.PerspectiveCamera(60,1,.1,300);
function rs(){R.setSize(innerWidth,innerHeight);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix()}addEventListener('resize',rs);rs();
scene.add(new THREE.HemisphereLight(0xdff3ff,0x3a5a30,.95));
const sun=new THREE.DirectionalLight(0xfff0c8,1);sun.position.set(6,14,-4);sun.target.position.set(0,0,-10);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);
Object.assign(sun.shadow.camera,{left:-15,right:15,top:30,bottom:-30,far:50});scene.add(sun,sun.target);

const cv=document.createElement('canvas');cv.width=cv.height=128;const g=cv.getContext('2d');
g.fillStyle='#9a7b52';g.fillRect(0,0,128,128);
for(let k=0;k<260;k++){g.fillStyle=Math.random()<.5?'rgba(70,45,20,.35)':'rgba(210,180,130,.3)';g.fillRect(Math.random()*128,Math.random()*128,2+Math.random()*3,2+Math.random()*3)}
g.fillStyle='rgba(255,240,200,.35)';[43,85].forEach(x=>g.fillRect(x-1.5,10,3,44));
const tex=new THREE.CanvasTexture(cv);tex.wrapS=tex.wrapT=THREE.RepeatWrapping;tex.repeat.set(1,30);
const road=new THREE.Mesh(new THREE.PlaneGeometry(9,300),new THREE.MeshStandardMaterial({map:tex,roughness:.8}));
road.rotation.x=-Math.PI/2;road.position.z=-140;road.receiveShadow=true;scene.add(road);
const gnd=new THREE.Mesh(new THREE.PlaneGeometry(200,300),new THREE.MeshStandardMaterial({color:0x3f7d3a,roughness:1}));gnd.rotation.x=-Math.PI/2;gnd.position.set(0,-.05,-140);gnd.receiveShadow=true;scene.add(gnd);
[-4.8,4.8].forEach(x=>{const r=new THREE.Mesh(new THREE.BoxGeometry(.6,.2,300),new THREE.MeshStandardMaterial({color:0x4f8f3a}));r.position.set(x,.1,-140);scene.add(r)});
const pillars=[],trunkM=new THREE.MeshStandardMaterial({color:0x5b3a1e}),leafM=[0x2f6b2f,0x3c8a3c,0x24572a].map(c=>new THREE.MeshStandardMaterial({color:c,flatShading:true}));
for(let i=0;i<20;i++)[-1,1].forEach(sd=>{const t=new THREE.Group(),tr=new THREE.Mesh(new THREE.CylinderGeometry(.3,.4,3,6),trunkM);tr.position.y=1.5;tr.castShadow=true;t.add(tr);
 for(let k=0;k<3;k++){const c=new THREE.Mesh(new THREE.ConeGeometry(2.2-k*.5,2.6,7),leafM[(i+k)%3]);c.position.y=3.2+k*1.5;c.castShadow=true;t.add(c)}
 t.scale.setScalar(.8+Math.random()*.9);t.position.set(sd*(7+Math.random()*8),0,-i*15-Math.random()*8);scene.add(t);pillars.push(t)});

/* Bicicleta */
const bike=new THREE.Group(),wheels=[];
const mFr=new THREE.MeshStandardMaterial({color:0x22d3ee,emissive:0x0891b2,emissiveIntensity:.8});
[-.9,.9].forEach(z=>{const w=new THREE.Group(),t=new THREE.Mesh(new THREE.TorusGeometry(.45,.07,8,20),new THREE.MeshStandardMaterial({color:0xeeeeff,emissive:0x6d28d9,emissiveIntensity:.6}));
 t.rotation.y=Math.PI/2;w.add(t);w.position.set(0,.5,z);bike.add(w);wheels.push(w)});
function tube(len,rx,y,z){const c=new THREE.Mesh(new THREE.CylinderGeometry(.04,.04,len,6),mFr);c.rotation.x=Math.PI/2+rx;c.position.set(0,y,z);c.castShadow=true;bike.add(c)}
tube(1.8,0,.95,0);tube(1.1,.9,.75,-.5);tube(1.1,-.9,.75,.5);
const hb=new THREE.Mesh(new THREE.CylinderGeometry(.03,.03,.7,6),mFr);hb.rotation.z=Math.PI/2;hb.position.set(0,1.25,-.8);bike.add(hb);
const rider=new THREE.Mesh(new THREE.BoxGeometry(.45,.8,.35),new THREE.MeshStandardMaterial({color:0xe879f9,emissive:0x86198f}));rider.position.set(0,1.5,.1);rider.rotation.x=.4;rider.castShadow=true;bike.add(rider);
const head=new THREE.Mesh(new THREE.SphereGeometry(.22,10,10),new THREE.MeshStandardMaterial({color:0xfbbf24}));head.position.set(0,2.05,-.1);bike.add(head);
const beam=new THREE.Mesh(new THREE.ConeGeometry(.9,4,16,1,true),new THREE.MeshBasicMaterial({color:0xfff3b0,transparent:true,opacity:.18,side:THREE.DoubleSide}));
beam.rotation.x=-Math.PI/2;beam.position.set(0,1,-3);
const pl=new THREE.PointLight(0xffe9b0,.5,10);pl.position.set(0,2.5,0);bike.add(pl);
scene.add(bike);

/* Objetos */
const gemGeo=new THREE.OctahedronGeometry(.5),coneGeo=new THREE.DodecahedronGeometry(.7).scale(1,.8,1),barGeo=new THREE.CylinderGeometry(.4,.4,2.4,10).rotateZ(Math.PI/2);
const gemMat=[0x22e5c0,0x22e5c0,0x22e5c0].map(c=>new THREE.MeshStandardMaterial({color:c,emissive:c,emissiveIntensity:.9,metalness:.5,roughness:.2}));
const coneMat=new THREE.MeshStandardMaterial({color:0x8a8f98,flatShading:true}),barMat=new THREE.MeshStandardMaterial({color:0x4a2c14});
function mkObs(l,z){const bar=Math.random()<.4,m=new THREE.Mesh(bar?barGeo:coneGeo,bar?barMat:coneMat);
 m.position.set(L[l],bar?.4:.55,z);m.castShadow=true;scene.add(m);objs.push({m,type:'obs',hw:bar?1.2:.65,hd:bar?.4:.6})}
function mkGem(l,z,gt){const m=new THREE.Mesh(gemGeo,gemMat[gt]);m.position.set(L[l],1.1,z);scene.add(m);objs.push({m,type:'gem',gt,hw:.6,hd:.6})}
function burst(x,y,z,c){for(let i=0;i<10;i++){const p=new THREE.Mesh(new THREE.BoxGeometry(.12,.12,.12),new THREE.MeshBasicMaterial({color:c}));
 p.position.set(x,y,z);scene.add(p);parts.push({p,v:new THREE.Vector3((Math.random()-.5)*6,Math.random()*5,(Math.random()-.5)*6),life:.6})}}

/* ---------- Estado de juego ---------- */
function reset(){
 objs.forEach(o=>scene.remove(o.m));objs=[];parts.forEach(o=>scene.remove(o.p));parts=[];
 S={t:0,speed:30,peak:30,dist:0,score:0,lane:1,own:{phone:1,console:1,head:1,shoes:1},mult:5.8,brake:false,bt:0,bf:0,
  riskUntil:0,riskItem:null,dblUntil:0,missed:0,pcd:0,ncd:0,pt:0,shake:0,spawn:.3,log:[],nm:0,pr:0,acc:0,bannerT:0,lost:0,gm:1,goldAdd:0,sm:1,pen:.5,dblObs:.4,xg:0,cardAt:18,cardMode:false,nc:0,ov:0,wb:0,ovl:0,nx:0,rec:0,rm:1};
 bike.position.set(0,0,0);bike.rotation.z=0;cam.fov=60;
 Object.keys(IT).forEach(k=>$('i_'+k).classList.remove('lost'));
 ['prompt','banner','riskTag','cards','ovw'].forEach(i=>$(i).classList.add('hidden'));$('vg').style.opacity=0;
}
const lg=t=>S.log.push('Seg '+Math.round(S.t)+': '+t);
const calc=()=>{S.mult=+Object.keys(IT).reduce((a,k)=>a+(S.own[k]?IT[k].m:0),0).toFixed(1)};
function loseItem(k){S.own[k]=0;S.lost++;calc();$('i_'+k).classList.add('lost');lg('Se desprendió de '+IT[k].n);beep(110,.5,'sawtooth',.2,-40);
 if(!Object.values(S.own).some(v=>v)){crash();return true}return false}
function start(){aStart();reset();state='RUNNING';['menu','end'].forEach(i=>$(i).classList.add('hidden'));$('hud').classList.remove('hidden')}
function move(d){if(state==='MENU'||state==='ENDED'||S.brake)return;S.lane=Math.max(0,Math.min(2,S.lane+d))}
function openPrompt(msg){
 if(state!=='RUNNING'||S.brake)return;const own=RO.filter(x=>S.own[x]);if(!own.length)return;
 state='PROMPT_PAUSE';S.pt=7;S.pcd=S.t+6;S.pr++;
 $('ptxt').innerHTML=(msg||'')+' Podés recuperarlas si te desprendés de uno de tus objetos:';
 const row=$('prow');row.innerHTML=own.map(k=>`<button class="btn flex-1 text-black" style="background:#fbbf24"><span class="text-2xl">${IT[k].i}</span><br><small>${IT[k].n}</small></button>`).join('');
 own.forEach((k,n)=>row.children[n].onclick=()=>resolve(true,k));
 $('prompt').classList.remove('hidden');beep(180,.3,'square',.12,-60);
}
function resolve(acc,k){
 $('prompt').classList.add('hidden');state='RUNNING';S.pcd=S.t+6;
 if(acc){const g=S.rec*S.rm;S.score+=g;S.acc++;lg('Recuperó '+g+' gemas');beep(300,.25,'sawtooth',.15,400);loseItem(k)}
 else lg('Eligió no recuperar las gemas');
}
function nearMiss(){}
$('banner').onclick=()=>{S.speed+=6;S.acc++;lg('Aceptó el impulso del casi-acierto (+6 km/h)');$('banner').classList.add('hidden');S.bannerT=0;beep(500,.2,'sawtooth',.12,300)};
$('no').onclick=()=>resolve(false);
$('brake').onclick=()=>{if(state!=='RUNNING'&&state!=='PROMPT_PAUSE')return;S.brake=true;S.bf=S.speed;S.bt=0;lg('Frenó a tiempo');
 $('prompt').classList.add('hidden');$('banner').classList.add('hidden');$('cards').classList.add('hidden');S.cardMode=false;state='RUNNING';beep(400,.6,'sine',.12,-250)};
const POOL=[
{n:'Multiplicador',i:'💰',c:'#4ade80',up:'Tus gemas se duplican (solo en el contador)',dn:'Obstáculos 25% más seguidos',f:()=>{S.gm*=2;S.sm*=.75}},
{n:'Cohete',i:'🚀',c:'#fb923c',up:'Vas más rápido: más gemas por segundo',dn:'Menos tiempo para reaccionar',f:()=>{S.speed+=10}},
{n:'Doble o Nada',i:'🎲',c:'#f87171',up:'Recuperar te devuelve el doble',dn:'Chocar cuesta 25% más gemas',f:()=>{S.rm*=2;S.pen+=.25}},
{n:'Racha de Gemas',i:'💎',c:'#60a5fa',up:'Más racimos de gemas',dn:'Chocar cuesta 10% más gemas',f:()=>{S.xg=.5;S.pen+=.1}}];
function openCards(){
 state='PROMPT_PAUSE';S.cardMode=true;S.cardAt=S.t+20;$('banner').classList.add('hidden');
 const pk=POOL.slice().sort(()=>Math.random()-.5).slice(0,3),row=$('cardrow');
 row.innerHTML=pk.map(p=>`<button class="card" style="--c:${p.c}"><div class="ic">${p.i}</div><b>${p.n}</b><span class="up"><i>Ganás</i>${p.up}</span><span class="dn"><i>Arriesgás</i>${p.dn}</span></button>`).join('');
 pk.forEach((p,k)=>row.children[k].onclick=()=>{p.f();S.nc++;lg('Eligió la mejora "'+p.n+'"');S.cardMode=false;state='RUNNING';$('cards').classList.add('hidden');beep(800,.12,'triangle');setTimeout(()=>beep(1100,.15,'triangle'),90)});
 $('cards').classList.remove('hidden');beep(700,.1,'triangle');
}
function crash(){
 if(state==='ENDED')return;state='ENDED';S.kind='crash';A.m&&(A.m.gain.value=0);aStop();
 lg('SOBRECARGA / choque final');const f=$('fl');f.classList.remove('go');void f.offsetWidth;f.classList.add('go');
 cam.rotateZ(.3);S.tilt=.3;setTimeout(showEnd,1100);
}
function end(){state='ENDED';S.kind='brake';aStop();beep(660,.15,'triangle');setTimeout(()=>beep(880,.3,'triangle'),160);setTimeout(showEnd,600)}

function showEnd(){
 $('hud').classList.add('hidden');$('prompt').classList.add('hidden');$('banner').classList.add('hidden');$('vg').style.opacity=0;
 const ok=S.kind==='brake',c=ok?'#34d399':'#f87171';
 const items=Object.keys(IT).map(k=>`<div class="glass p-2 text-center text-sm" style="opacity:${S.own[k]?1:.6}"><div class="text-2xl">${IT[k].i}</div>${IT[k].n}<div style="color:${S.own[k]?'#34d399':'#f87171'}">${S.own[k]?'✔ Conservada':'✖ Perdida'}</div></div>`).join('');
 $('endin').innerHTML=`
 <h2 class="text-3xl font-bold" style="color:${c}">${ok?'PARASTE A TIEMPO':'SOBRECARGA'}</h2>
 <p class="mb-4">${ok?'Conservaste tus pertenencias y mantuviste el control.':'Perdiste el control. Todo pasó demasiado rápido.'}</p>
 <div class="grid grid-cols-3 gap-2 text-center mb-4">
  <div class="glass p-2"><div class="text-xl font-bold">${Math.round(S.dist)} m</div><div class="text-xs text-slate-400">Distancia</div></div>
  <div class="glass p-2"><div class="text-xl font-bold">${Math.round(S.peak)} km/h</div><div class="text-xs text-slate-400">Velocidad máxima</div></div>
  <div class="glass p-2"><div class="text-xl font-bold">${Math.floor(S.score)}</div><div class="text-xs text-slate-400">Gemas</div></div></div>
 <h3 class="font-bold text-cyan-300 mb-1">Línea de decisiones</h3>
 <ul class="glass p-3 mb-4 text-sm max-h-40 overflow-y-auto space-y-1">${S.log.length?S.log.map(x=>'<li>'+x+'</li>').join(''):'<li>Sin decisiones registradas.</li>'}</ul>
 <h3 class="font-bold text-cyan-300 mb-1">Tus pertenencias</h3><div class="grid grid-cols-4 gap-2 mb-4">${items}</div>
 <div class="glass p-4 mb-4" style="border-color:#e879f9"><h3 class="font-bold text-fuchsia-300 mb-2">Lo que había detrás del juego</h3>
  <ul class="text-sm space-y-2">
   <li><b>PERSEGUIR PÉRDIDAS (RECUPERÁ):</b> el impulso de apostar más para recuperar lo que se perdió. Te lo ofrecieron ${S.pr} ${S.pr==1?'vez':'veces'}.</li>
   <li><b>RECOMPENSA VARIABLE:</b> las gemas aparecían sin un patrón fijo. La incertidumbre engancha más que un premio seguro.</li>
   <li><b>ESCALADA:</b> más velocidad significa menos tiempo para pensar. Los avisos y las oportunidades aceptadas (${S.acc}) siempre empujaban hacia arriba.</li><li><b>MEJORAS CON RIESGO:</b> cada carta prometía más premio a cambio de más peligro. Elegiste ${S.nc}. Cuanto más ganás, más cuesta frenar.</li></ul>
  <p class="mt-3 italic text-slate-200">Mientras intentabas recuperar lo que te perdiste, ¿qué más empezaste a perder?</p></div>
 <p class="text-center font-bold text-amber-300 mb-3">Hablar es Ganar | LOTBA Juego Responsable</p>
 <button id="rst" class="btn w-full text-black" style="background:linear-gradient(90deg,#22d3ee,#e879f9)">REINICIAR EXPERIMENTO</button>`;
 $('end').classList.remove('hidden');$('rst').onclick=start;
}

/* ---------- Bucle ---------- */
function scenery(d,ws){
 tex.offset.y+=ws*d/10;pillars.forEach(p=>{p.position.z+=ws*d;if(p.position.z>12)p.position.z-=300});wheels.forEach(w=>w.rotation.x-=ws*d/.45);
}
function spawn(){
 const gd=Math.min(1,.3+S.t/50),n=2+Math.min(2,Math.floor(S.t/20))+S.nx;
 const l=[0,1,2].sort(()=>Math.random()-.5),z=-115,gp=()=>0;
 if(Math.random()<.5){mkObs(l[0],z);if(S.speed>45&&Math.random()<S.dblObs)mkObs(l[1],z-4);if(Math.random()<.35*gd){const gt=gp();for(let i=0;i<n;i++)mkGem(l[2],z-i*2.5,gt)}}
 else{if(Math.random()<.6*gd){const gt=gp();for(let i=0;i<n;i++)mkGem(l[0],z-i*2.5,gt)}if(Math.random()<.5)mkObs(l[1],z)}
 if(Math.random()<S.xg){const gt=gp();for(let i=0;i<n;i++)mkGem(l[2],z-12-i*2.5,gt)}
}
function update(dt){
 if(S.cardMode)return;
 const slow=state==='PROMPT_PAUSE';
 if(slow){S.pt-=dt;$('pbar').style.width=Math.max(0,S.pt/7*100)+'%';if(S.pt<=0)resolve(false)}
 const d=dt*(slow?.1:1);S.t+=d;
 if(S.brake){S.bt+=dt;const k=Math.min(1,S.bt/2);S.speed=S.bf*(1-k*k*(3-2*k));if(k>=1){end();return}}
 
 S.peak=Math.max(S.peak,S.speed);const ws=S.speed*.65;S.dist+=ws*d;
 bike.position.x+=(L[S.lane]-bike.position.x)*(1-Math.exp(-12*d));bike.rotation.z=-(L[S.lane]-bike.position.x)*.08;
 scenery(d,ws);
 if(!S.brake){S.spawn-=d;if(S.spawn<=0){S.spawn=Math.max(.45,1.3-(S.speed-30)*.012)*S.sm;spawn()}}
 const bx=bike.position.x;
 for(let i=objs.length-1;i>=0;i--){const o=objs[i],m=o.m;m.position.z+=ws*d;
  if(o.type==='gem'){m.rotation.y+=3*d;m.position.y=1.1+Math.sin(S.t*4+i)*.15}
  const dx=Math.abs(bx-m.position.x),z=m.position.z;
  if(!S.brake&&Math.abs(z)<1.2+o.hd&&dx<.5+o.hw){
   scene.remove(m);objs.splice(i,1);
   if(o.type==='gem'){S.score+=S.gm*(S.t<S.dblUntil?2:1);S.missed=0;burst(m.position.x,1.1,z,gemMat[o.gt].color.getHex());gemSnd(o.gt)}
   else{
    S.shake=.5;const lost=Math.min(Math.floor(S.score),Math.max(1,Math.floor(S.score*Math.min(.9,S.pen))));S.score-=lost;S.rec=lost;lg('Chocó un obstáculo (-'+lost+' gemas)');beep(90,.35,'sawtooth',.25,-30);
    
    if(lost)openPrompt('Perdiste '+lost+' gemas.');
   }continue}
  if(z>2){
   if(o.type==='gem'){S.missed++;if(dx<3.2&&Math.random()<.25&&S.t>S.ncd&&!S.brake)nearMiss();
    if(S.missed>=6&&S.t>S.pcd&&!S.brake){S.rec=S.missed;S.missed=0;openPrompt('Dejaste pasar '+S.rec+' gemas.')}}
   else if(dx<2.2&&S.t>S.ncd&&!S.brake)nearMiss();
   scene.remove(m);objs.splice(i,1)}
 }
 for(let i=parts.length-1;i>=0;i--){const q=parts[i];q.life-=d;q.p.position.addScaledVector(q.v,d);q.v.y-=12*d;if(q.life<=0){scene.remove(q.p);parts.splice(i,1)}}
 if(S.bannerT>0){S.bannerT-=d;if(S.bannerT<=0)$('banner').classList.add('hidden')}
 if(!S.brake&&S.speed>=90){const o=S.speed>=100;
  if(o){if(!S.ovl){S.ovl=1;lg('Superó 100 km/h: comenzó la cuenta regresiva de sobrecarga')}S.ov+=d;if(S.ov>=4){crash();return}}else S.ov=Math.max(0,S.ov-d);
  S.wb-=d;if(S.wb<=0){S.wb=o?.4:1;beep(o?900:600,.1,'square',.1)}
  $('ovw').classList.remove('hidden');$('ovw').textContent=o?'¡SOBRECARGA EN '+(4-S.ov).toFixed(1)+' s! FRENÁ AHORA':'⚠ ZONA DE SOBRECARGA'}
 else{S.ov=0;$('ovw').classList.add('hidden')}
 /* Distorsión */
 const hi=Math.max(0,S.speed-70),fov=60+Math.min(28,Math.max(0,S.speed-30)*.4);
 cam.fov+=(fov-cam.fov)*.05;cam.updateProjectionMatrix();S.shake*=.9;
 $('vg').style.opacity=Math.min(1,hi/30)*.9;
 if(A.o1){A.o1.frequency.value=55+S.speed*1.6+(hi?Math.random()*hi*2:0);A.o2.frequency.value=A.o1.frequency.value*1.5;A.g2.gain.value=hi/30*.04}
 /* HUD */
 $('score').textContent=Math.floor(S.score);
 gv+=(S.speed-gv)*(1-Math.exp(-8*dt));$('ndl').setAttribute('transform','rotate('+(-120+Math.max(0,Math.min(gv,105))*2.4)+' 60 60)');$('dist').textContent=Math.round(S.dist);
 
 if(S.t>=S.cardAt&&state==='RUNNING'&&!S.brake)openCards();
}
function camUpdate(){
 const amp=(S.speed>70?(S.speed-70)*.0035:0)+(S.shake||0),r=()=>(Math.random()-.5)*amp;
 cam.position.set(bike.position.x*.6+r(),4+r(),8.5);cam.lookAt(bike.position.x*.3,1,-8);if(S.tilt)cam.rotateZ(S.tilt);
}
function loop(now){
 requestAnimationFrame(loop);const dt=Math.min(.05,(now-last)/1000||0);last=now;
 if(state==='RUNNING'||state==='PROMPT_PAUSE')update(dt);else if(state==='MENU')scenery(dt,12);
 if(state==='MENU'){S.speed=30;S.shake=0;S.tilt=0;beep&&0}
 camUpdate();R.render(scene,cam);
}
reset();requestAnimationFrame(loop);

/* ---------- Velocímetro ---------- */
(function(){
 const cx=60,cy=60,R=46,A=v=>-120+v*2.4,P=(a,r)=>{const t=(a-90)*Math.PI/180;return[cx+r*Math.cos(t),cy+r*Math.sin(t)]};
 const arc=(v1,v2,c,w)=>{const[x1,y1]=P(A(v1),R),[x2,y2]=P(A(v2),R);return`<path d="M${x1} ${y1}A${R} ${R} 0 0 1 ${x2} ${y2}" stroke="${c}" stroke-width="${w}" fill="none" stroke-linecap="round"/>`};
 let h=arc(0,100,'rgba(255,255,255,.25)',4)+arc(70,90,'#fbbf24',4)+arc(90,100,'#ef4444',4);
 for(let v=0;v<=100;v+=10){const m=v%20==0,[x1,y1]=P(A(v),R-(m?9:6)),[x2,y2]=P(A(v),R-2);h+=`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#eef" stroke-width="${m?1.6:1}" opacity=".8"/>`;
  if(m){const[tx,ty]=P(A(v),R-16);h+=`<text x="${tx}" y="${ty+2.5}" fill="#eef" font-size="7" text-anchor="middle" font-family="Chakra Petch,sans-serif">${v}</text>`}}
 h+=`<text x="60" y="84" fill="#eef" opacity=".7" font-size="7" text-anchor="middle" font-family="Chakra Petch,sans-serif">km/h</text><g id="ndl" transform="rotate(-120 60 60)"><line x1="60" y1="66" x2="60" y2="20" stroke="#f87171" stroke-width="2.4" stroke-linecap="round"/></g><circle cx="60" cy="60" r="4.5" fill="#eef"/>`;
 $('gauge').innerHTML=h;
})();
/* ---------- Controles ---------- */
$('start').onclick=start;
$('bl').onclick=()=>move(-1);$('br').onclick=()=>move(1);
addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(k==='arrowleft'||k==='a')move(-1);if(k==='arrowright'||k==='d')move(1)});
let tx=null;addEventListener('touchstart',e=>{tx=e.touches[0].clientX},{passive:true});
addEventListener('touchend',e=>{if(tx===null)return;const dx=e.changedTouches[0].clientX-tx;if(Math.abs(dx)>30)move(dx>0?1:-1);tx=null},{passive:true});
</script>
